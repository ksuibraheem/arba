<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--card:#161630;--card2:#1c1c3a;--accent:#e8b931;--accent2:#f0d060;--text:#e8e8f0;--text2:#a0a0c0;--border:#2a2a4a;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;--cyan:#06b6d4;--pink:#ec4899}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#1a1040 0%,#0d0d2b 50%,#1a0a30 100%);padding:24px 32px;border-bottom:2px solid var(--accent);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;right:-10%;width:300px;height:300px;background:radial-gradient(circle,rgba(232,185,49,0.08) 0%,transparent 70%);pointer-events:none}
.header-content{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.logo{display:flex;align-items:center;gap:16px}
.logo-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),#d4a020);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#0f0f1a;box-shadow:0 4px 20px rgba(232,185,49,0.3)}
.logo h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{font-size:13px;color:var(--text2);margin-top:2px}
.header-info{text-align:left;font-size:13px;color:var(--text2)}
.header-info span{display:block;color:var(--accent);font-weight:700;font-size:15px}
.container{max-width:1400px;margin:0 auto;padding:20px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;padding:12px;background:var(--card);border-radius:16px;border:1px solid var(--border)}
.tab{padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;transition:all .3s;border:1px solid transparent;color:var(--text2);white-space:nowrap}
.tab:hover{background:var(--card2);color:var(--text)}
.tab.active{background:linear-gradient(135deg,var(--accent),#d4a020);color:#0f0f1a;border-color:var(--accent);box-shadow:0 4px 15px rgba(232,185,49,0.25)}
.section{display:none;animation:fadeIn .4s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.card-title{font-size:18px;font-weight:800;margin-bottom:4px;color:var(--accent)}
.card-subtitle{font-size:13px;color:var(--text2);margin-bottom:20px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{background:var(--card2);color:var(--accent);padding:12px 16px;text-align:right;font-weight:700;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:1}
thead th:first-child{border-radius:0 10px 0 0}
thead th:last-child{border-radius:10px 0 0 0}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(232,185,49,0.05)}
tbody td{padding:10px 16px;border-bottom:1px solid var(--border);text-align:right}
tbody td:last-child,tbody td:nth-last-child(2){font-family:'Cairo',monospace;direction:ltr;text-align:left}
.total-row{background:rgba(232,185,49,0.08)!important;font-weight:800}
.total-row td{border-top:2px solid var(--accent);color:var(--accent);font-size:15px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.summary-card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:20px;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.summary-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,0.3)}
.summary-card .label{font-size:13px;color:var(--text2);margin-bottom:8px}
.summary-card .value{font-size:22px;font-weight:800;color:var(--accent)}
.summary-card .percent{font-size:12px;color:var(--green);margin-top:4px}
.summary-card .bar{position:absolute;bottom:0;right:0;left:0;height:4px;background:var(--border);border-radius:0 0 14px 14px}
.summary-card .bar-fill{height:100%;border-radius:0 0 14px 14px;transition:width .8s ease}
.grand-total{background:linear-gradient(135deg,#1a1040,#2a1050);border:2px solid var(--accent);border-radius:16px;padding:32px;text-align:center;margin:24px 0}
.grand-total .label{font-size:16px;color:var(--text2)}
.grand-total .value{font-size:42px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}
.grand-total .sub{font-size:14px;color:var(--text2)}
.gantt{overflow-x:auto;padding:20px 0}
.gantt-row{display:flex;align-items:center;margin-bottom:6px;min-height:36px}
.gantt-label{min-width:200px;font-size:12px;font-weight:600;padding-left:12px;text-align:right;color:var(--text)}
.gantt-bar-wrap{flex:1;position:relative;height:28px;background:var(--card2);border-radius:6px;overflow:hidden}
.gantt-bar{position:absolute;height:100%;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5);transition:width .6s ease}
.gantt-week-markers{display:flex;margin-bottom:8px;padding-right:200px}
.gantt-week{flex:1;text-align:center;font-size:10px;color:var(--text2);border-left:1px solid var(--border);min-width:20px}
.chart-container{display:flex;justify-content:center;align-items:center;gap:32px;flex-wrap:wrap;padding:20px}
.pie-chart{position:relative;width:280px;height:280px}
.pie-legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:10px;font-size:13px}
.legend-color{width:16px;height:16px;border-radius:4px}
.print-btn{background:linear-gradient(135deg,var(--accent),#d4a020);color:#0f0f1a;border:none;padding:12px 28px;border-radius:10px;font-family:'Cairo';font-size:14px;font-weight:700;cursor:pointer;transition:transform .2s;box-shadow:0 4px 15px rgba(232,185,49,0.3)}
.print-btn:hover{transform:scale(1.05)}
.duration-badge{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--accent);border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;color:var(--accent)}
@media print{body{background:#fff;color:#000}.header{background:#fff!important;border-color:#333}.tabs{display:none}.section{display:block!important;page-break-inside:avoid}.card{border-color:#ccc}table{font-size:11px}thead th{background:#f0f0f0;color:#333}.summary-card{border-color:#ccc}}
@media(max-width:768px){.header-content{flex-direction:column;text-align:center}.summary-grid{grid-template-columns:1fr}.tabs{overflow-x:auto;flex-wrap:nowrap}.tab{font-size:12px;padding:8px 12px}}
</style>

// Calculate totals
const cats=Object.keys(DATA);
const totals={};
let grandTotal=0;
cats.forEach(k=>{
  let t=0;
  DATA[k].items.forEach(i=>{t+=i.q*i.r});
  totals[k]=t;
  grandTotal+=t;
});

// Build tabs
const tabNames=[...cats.map(k=>({id:k,name:DATA[k].name,icon:DATA[k].icon})),
  {id:'summary',name:'الملخص الشامل',icon:'📊'},{id:'gantt',name:'المخطط الزمني',icon:'📅'}];
const tabsEl=document.getElementById('tabs');
tabNames.forEach((t,i)=>{
  const btn=document.createElement('div');
  btn.className='tab'+(i===tabNames.length-2?' active':'');
  btn.textContent=t.icon+' '+t.name;
  btn.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-'+t.id).classList.add('active');
  };
  tabsEl.appendChild(btn);
});

ganttHTML+='<div class="gantt-week-markers">';
for(let w=1;w<=totalWeeks;w++){
  ganttHTML+=`<div class="gantt-week">${w}</div>`;
}
ganttHTML+='</div>';
ganttData.forEach(g=>{
  const left=((g.s-1)/totalWeeks*100).toFixed(1);
  const width=((g.e-g.s+1)/totalWeeks*100).toFixed(1);
  ganttHTML+=`<div class="gantt-row">
    <div class="gantt-label">${g.n}</div>
    <div class="gantt-bar-wrap">
      <div class="gantt-bar" style="right:${left}%;width:${width}%;background:linear-gradient(135deg,${g.c},${g.c}88)">${g.e-g.s+1}w</div>
    </div>
  </div>`;
});
ganttHTML+='</div></div>';
ganttHTML+=`<div class="card">
  <div class="card-title">📋 جدول المراحل التفصيلي</div>
  <div style="overflow-x:auto"><table>
  <thead><tr><th>#</th><th>النشاط</th><th>البداية (أسبوع)</th><th>النهاية (أسبوع)</th><th>المدة (أسابيع)</th></tr></thead>
  <tbody>${ganttData.map((g,i)=>`<tr><td>${i+1}</td><td>${g.n}</td><td>${g.s}</td><td>${g.e}</td><td>${g.e-g.s+1}</td></tr>`).join('')}
  </tbody></table></div>
</div>`;
ganttSec.innerHTML=ganttHTML;
contentEl.appendChild(ganttSec);

// Draw pie chart
setTimeout(()=>{
  const canvas=document.getElementById('pieChart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const cx=160,cy=160,r=130;
  let startAngle=-Math.PI/2;
  const legendEl=document.getElementById('pieLegend');
  cats.forEach((k,i)=>{
    const pct=totals[k]/grandTotal;
    const endAngle=startAngle+pct*2*Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,startAngle,endAngle);
    ctx.fillStyle=colors[i];
    ctx.fill();
    ctx.strokeStyle='#0f0f1a';
    ctx.lineWidth=2;
    ctx.stroke();
    startAngle=endAngle;
    if(legendEl){
      legendEl.innerHTML+=`<div class="legend-item"><div class="legend-color" style="background:${colors[i]}"></div>${DATA[k].name}: ${(pct*100).toFixed(1)}%</div>`;
    }
  });
  // Center circle
  ctx.beginPath();
  ctx.arc(cx,cy,60,0,2*Math.PI);
  ctx.fillStyle='#161630';
  ctx.fill();
  ctx.fillStyle='#e8b931';
  ctx.font='bold 14px Cairo';
  ctx.textAlign='center';
  ctx.fillText(fmt(grandTotal),cx,cy-4);
  ctx.font='11px Cairo';
  ctx.fillStyle='#a0a0c0';
  ctx.fillText('ر.س',cx,cy+14);
},200);
</script>
</body>
</html>
